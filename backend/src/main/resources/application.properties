spring.application.name=craftcorner-backend
server.port=8080

# ── DataSource ────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/craftcorner
spring.datasource.username=craftcorner
spring.datasource.password=craftcorner
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────────
app.jwt.secret=CraftCornerSuperSecretKeyForJWTTokenGeneration2026!
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ── File Upload ───────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=uploads

# ── CORS ──────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:4200

# ── Logging ───────────────────────────────────────────────
logging.level.com.craftcorner=INFO
logging.level.org.springframework.security=WARN
