<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <a routerLink="/" class="brand-link">
        <i class="fa-solid fa-store"></i> CraftCorner
      </a>
      <h2>Create an account</h2>
      <p>Join the handmade marketplace</p>
    </div>

    @if (error) {
      <div class="alert alert-danger py-2 small">
        <i class="fa-solid fa-circle-exclamation me-2"></i>{{ error }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">

      <!-- Role selector -->
      <div class="role-selector mb-4">
        <label class="form-label fw-semibold mb-2">I want to</label>
        <div class="row g-2">
          <div class="col-6">
            <input type="radio" class="btn-check" id="roleBuyer" formControlName="role" value="ROLE_BUYER">
            <label class="btn btn-outline-primary w-100" for="roleBuyer">
              <i class="fa-solid fa-bag-shopping d-block mb-1 fs-4"></i>
              Buy Products
            </label>
          </div>
          <div class="col-6">
            <input type="radio" class="btn-check" id="roleSeller" formControlName="role" value="ROLE_SELLER">
            <label class="btn btn-outline-primary w-100" for="roleSeller">
              <i class="fa-solid fa-store d-block mb-1 fs-4"></i>
              Sell Products
            </label>
          </div>
        </div>
      </div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <label class="form-label">First Name</label>
          <input type="text" class="form-control" formControlName="firstName"
                 [class.is-invalid]="f['firstName'].invalid && f['firstName'].touched">
          <div class="invalid-feedback">Min 2 characters</div>
        </div>
        <div class="col-6">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-control" formControlName="lastName"
                 [class.is-invalid]="f['lastName'].invalid && f['lastName'].touched">
          <div class="invalid-feedback">Min 2 characters</div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" formControlName="email"
               [class.is-invalid]="f['email'].invalid && f['email'].touched">
        <div class="invalid-feedback">Valid email is required</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone (optional)</label>
        <input type="tel" class="form-control" formControlName="phone">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input [type]="showPassword ? 'text' : 'password'"
                 class="form-control" formControlName="password"
                 [class.is-invalid]="f['password'].invalid && f['password'].touched">
          <button class="btn btn-outline-secondary" type="button"
                  (click)="showPassword = !showPassword">
            <i class="fa-solid" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
          </button>
          <div class="invalid-feedback">Min 6 characters</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-1" [disabled]="loading">
        @if (loading) {
          <span class="spinner-border spinner-border-sm me-2"></span>
        }
        Create Account
      </button>

    </form>

    <p class="text-center mt-3 small">
      Already have an account?
      <a routerLink="/auth/login" class="text-brown fw-semibold">Sign in</a>
    </p>

  </div>
</div>
